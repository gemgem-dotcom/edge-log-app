# Hourly retry for trades whose MFE/MAE/drawdown fetch was blocked by this
# account's ~8-hour Databento access embargo at save time
# (market_data_status = 'pending') - see scripts/retry-trade-excursions.js
# and schema.sql's comment above `mfe_points` for the full picture.
#
# Hourly, not daily like refresh-market-session-stats.yml - "hourly is
# reasonable given the 8-hour window" per the brief this shipped under,
# and unlike that job (which only ever needs yesterday's already-closed
# session), a 'pending' trade should be picked up again soon after its own
# 8-hour mark clears, not up to a day later.
#
# Node 22, not 20: @supabase/supabase-js's createClient always constructs
# an internal Realtime sub-client, which throws under Node 20 for lacking
# native WebSocket support - the same failure that broke refresh-market-
# session-stats.yml's first deploy (see that workflow's own comment).
# Fixed here from the start rather than repeating that discovery.
#
# Same repo secrets as refresh-market-session-stats.yml (DATABENTO_API_KEY,
# SUPABASE_SERVICE_ROLE_KEY, NEXT_PUBLIC_SUPABASE_URL, and the optional
# NEXT_PUBLIC_SENTRY_DSN - see that workflow's own comment).

name: Retry pending trade excursions

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Retry pending trade excursions
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
        run: node scripts/retry-trade-excursions.js
