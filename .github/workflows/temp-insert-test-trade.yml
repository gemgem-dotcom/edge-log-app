# TEMPORARY - inserts one real test trade (NQ, entry/exit well past the
# 8-hour embargo, market_data_status='pending') so scripts/retry-trade-
# excursions.js can be confirmed live against a real row, per the brief's
# own bar for done. Deleted (and the test trade deleted from Supabase)
# once that's confirmed - see PR #117.
name: TEMP - insert test trade for excursion retry check

on:
  push:
    branches:
      - claude/mfe-mae-drawdown

jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          python3 - <<'PYEOF'
          import os
          import requests

          url = os.environ['NEXT_PUBLIC_SUPABASE_URL']
          key = os.environ['SUPABASE_SERVICE_ROLE_KEY']
          headers = {'apikey': key, 'Authorization': f'Bearer {key}', 'Content-Type': 'application/json'}

          r = requests.get(f'{url}/rest/v1/instruments',
                            params={'select': 'id,user_id,symbol', 'data_symbol': 'eq.NQ', 'limit': 1},
                            headers=headers)
          r.raise_for_status()
          instruments = r.json()
          if not instruments:
              print('No NQ-family instrument exists - cannot insert a test trade.')
              raise SystemExit(1)
          instrument = instruments[0]
          print(f'Using instrument {instrument["symbol"]} ({instrument["id"]}) owned by user {instrument["user_id"]}')

          # 2026-08-24 09:30-10:00 ET - a date already confirmed reachable
          # (Part A/B's daily job + backfill both fetched this exact date
          # successfully) and >24h in the past, well past the 8h embargo.
          trade = {
              'user_id': instrument['user_id'],
              'instrument_id': instrument['id'],
              'trade_date': '2026-08-24',
              'trade_time': '09:30:00',
              'direction': 'long',
              'entry': 20000,
              'stop': 19980,
              'stop_distance': 20,
              'exit_price': 20010,
              'exit_time': '10:00:00',
              'r_multiple': 0.5,
              'reasoning': 'TEMP test trade - scripts/retry-trade-excursions.js live confirmation (PR #117). Safe to delete.',
              'market_data_status': 'pending',
          }
          r = requests.post(f'{url}/rest/v1/trades', headers={**headers, 'Prefer': 'return=representation'}, json=trade)
          if not r.ok:
              print(f'Insert failed: {r.status_code} {r.text}')
              raise SystemExit(1)
          inserted = r.json()[0]
          print(f'Inserted test trade {inserted["id"]}, market_data_status={inserted["market_data_status"]}')
          PYEOF
