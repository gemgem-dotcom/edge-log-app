# Build check + unit tests + lint
#
# Runs a full production build of the app, the Vitest unit suite
# (lib/*.test.js - the pure trade-math/excursion-matching/stats-engine
# functions), and ESLint (eslint.config.mjs - systems-map audit finding
# #3: this repo previously had no lint config at all), on every push and
# every pull request. All three jobs run in parallel off the same
# trigger; any one going red puts a X on the commit, so a broken change
# gets caught before it can reach the live site.
#
# The Supabase values below are throwaway placeholders. The build only
# needs them to exist so the Supabase client can be constructed; nothing
# during a build talks to the real database. The test job sets its own
# copies for the same reason (some lib modules under test transitively
# import lib/supabaseClient.js) - see vitest.setup.js.

name: Build check

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # 22, not 20 (the build job's version) - @supabase/supabase-js's
          # createClient always constructs an internal Realtime
          # (WebSocket) sub-client, and that constructor throws under
          # Node 20 for lacking native WebSocket support. Some test files
          # transitively import lib/supabaseClient.js (see vitest.setup.js),
          # so this suite hits the exact same issue the two Databento
          # scheduled workflows already found and fixed the same way - see
          # .github/workflows/refresh-market-session-stats.yml's comment.
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      # End-to-end smoke of scan-rejection-conditions.js against synthetic
      # bars, no Databento key needed. The unit tests only cover extracted
      # pure functions, which is exactly how a rewrite shipped a reference
      # to a variable it had deleted: `node -c` passed, lint passed, and
      # the error only surfaced as "285 days failed / 0 events" at the end
      # of a 20-minute Actions job. The scan catches per-day errors and
      # still exits 0, so this asserts on event count and failure count
      # rather than trusting the exit status.
      - name: Smoke-test the rejection scan
        run: npm run smoke:scan

      # The strategy search's honesty check: run the whole search against a
      # synthetic series that provably has no edge (a martingale, asserted as
      # one rather than assumed) and require it to find nothing. Lookahead is
      # invisible to lint and to unit tests, and it does not throw - it just
      # returns a wonderful backtest. Three versions of this search reported
      # z > 4 on pure noise before the null was matched on volatility regime,
      # and every one of them would have read as a discovery. Verified to fail
      # on a one-bar lookahead deliberately reintroduced.
      - name: Control-test the strategy search
        run: npm run control:search

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        # lint:ci, not lint - it caps warnings at the current baseline, so
        # the count can only go down. A plain `eslint .` exits 0 no matter
        # how many warnings accumulate, which made warning number fifty
        # invisible among the forty-nine already there. Lower the number in
        # package.json as warnings are cleared; a real error still fails
        # this job on its own regardless.
        run: npm run lint:ci
