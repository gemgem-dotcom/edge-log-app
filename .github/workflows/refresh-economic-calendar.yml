# Hourly economic-calendar refresh
#
# Runs scripts/fetch-economic-calendar.js against forexfactory.com's own
# calendar HTML and upserts into economic_events. See that script's header
# for the source and access reasoning, and schema.sql's comment above
# `create table economic_events` for the storage side.
#
# Two schedules, one script:
#
#   hourly  - this week only, one ~400KB page. This is the one that keeps
#             `actual` figures current: FF fills them in within minutes of
#             a release printing, and each run upserts the same rows.
#   daily   - last month through next month, as month pages. This is the
#             backward and forward fill: it keeps roughly a quarter of
#             calendar either side of today complete, catches late
#             revisions, and picks up events added weeks ahead.
#
# A wider one-off backfill is the same script with CALENDAR_MONTHS_BACK set
# higher - run this workflow by hand rather than adding another schedule.
# It reaches about two months back and no further: FF serves ?month= pages
# for roughly the last 90 days to this User-Agent and 403s older ones
# (measured twice on 2026-09-12 - jul.2026 served, jun.2026 refused). A
# bigger number logs failed pages, it does not fetch more history.
#
# Nothing here ever deletes, so coverage only ever grows.
#
# Minute 7 rather than :00 to stay off the hour boundary every other
# scheduled job on GitHub's shared runners piles onto - Actions' own docs
# warn that cron at the top of the hour is the most likely to be delayed.
#
# Like refresh-market-session-stats.yml (and unlike refresh-cme-holidays.yml)
# this never touches a committed file: it writes straight to Supabase with
# SUPABASE_SERVICE_ROLE_KEY and exits, so there's no commit/PR/build-gate
# mechanic here.
#
# The script retries a failed fetch three times with backoff before giving
# up, so this workflow goes red for "the feed moved or we're being
# refused", not for one flaky request.
#
# Secrets needed (the same ones refresh-market-session-stats.yml already
# documents - no new ones):
#   SUPABASE_SERVICE_ROLE_KEY
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SENTRY_DSN     optional; the script's Sentry.init no-ops
#                              without it

name: Refresh economic calendar

on:
  schedule:
    # Hourly at :07 - off the top of the hour, where Actions' own docs warn
    # scheduled jobs bunch up and get delayed.
    - cron: '7 * * * *'
    # Daily at 04:17 UTC, the quiet end of the calendar's day, for the
    # wider month sweep.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      months_back:
        description: How many months back to fetch (0 = this week only)
        required: false
        default: '0'
        type: string
      months_forward:
        description: How many months forward to fetch
        required: false
        default: '0'
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # 22 for the same reason the other scheduled workflows pin it -
          # see refresh-market-session-stats.yml's own note on
          # @supabase/supabase-js needing native WebSocket support.
          node-version: '22'

      - name: Install dependencies
        run: npm install

      # The daily cron gets the month sweep; the hourly one and a bare
      # manual run get this week. github.event.schedule is the only thing
      # that distinguishes two crons on one workflow, so the scope is
      # derived from it here rather than by splitting this into two nearly
      # identical files.
      - name: Fetch and store the economic calendar
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          CALENDAR_MONTHS_BACK: ${{ github.event.schedule == '17 4 * * *' && '1' || inputs.months_back || '0' }}
          CALENDAR_MONTHS_FORWARD: ${{ github.event.schedule == '17 4 * * *' && '1' || inputs.months_forward || '0' }}
        run: node scripts/fetch-economic-calendar.js
