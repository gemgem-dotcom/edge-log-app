# Hourly economic-calendar refresh
#
# Runs scripts/fetch-economic-calendar.js, which pulls Forex Factory's
# published this-week calendar JSON feed and upserts it into
# economic_events. See that script's header for why it reads the feed
# rather than scraping forexfactory.com/calendar, and schema.sql's comment
# above `create table economic_events` for the storage side.
#
# One feed, not three: the lastweek/nextweek variants this was originally
# written against both 404 (confirmed live by
# scripts/smoke-test-forexfactory-feed.js). Rows accumulate rather than
# being replaced, so the history behind the card still grows week by week
# from whenever this starts running.
#
# Hourly, not daily, because FF revises the calendar through the week - it
# adds speeches, reschedules releases and updates forecasts - and an
# hourly refresh keeps that current for the cost of one small JSON request
# against a feed published for programmatic use. Note it is NOT for
# `actual` figures: this feed carries none (also confirmed live).
#
# Minute 7 rather than :00 to stay off the hour boundary every other
# scheduled job on GitHub's shared runners piles onto - Actions' own docs
# warn that cron at the top of the hour is the most likely to be delayed.
#
# Like refresh-market-session-stats.yml (and unlike refresh-cme-holidays.yml)
# this never touches a committed file: it writes straight to Supabase with
# SUPABASE_SERVICE_ROLE_KEY and exits, so there's no commit/PR/build-gate
# mechanic here.
#
# The script retries a failed fetch three times with backoff before giving
# up, so this workflow goes red for "the feed moved or we're being
# refused", not for one flaky request.
#
# Secrets needed (the same ones refresh-market-session-stats.yml already
# documents - no new ones):
#   SUPABASE_SERVICE_ROLE_KEY
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SENTRY_DSN     optional; the script's Sentry.init no-ops
#                              without it

name: Refresh economic calendar

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # 22 for the same reason the other scheduled workflows pin it -
          # see refresh-market-session-stats.yml's own note on
          # @supabase/supabase-js needing native WebSocket support.
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Fetch and store the economic calendar
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
        run: node scripts/fetch-economic-calendar.js
