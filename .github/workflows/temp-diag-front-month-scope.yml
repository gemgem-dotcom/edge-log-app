# TEMPORARY, one-off workflow - not part of the app's permanent CI surface.
# Runs scripts/diag-front-month-scope.js once: investigates the front-
# month-resolution discrepancy on trade 076af9b3 (does Databento's own
# NQ.c.0 continuous symbol agree with the "highest volume that session"
# method?) and scans every trade for roll-date proximity. Deleted after
# this one run.

name: TEMP - diagnose front-month resolution scope

on:
  workflow_dispatch: {}
  push:
    branches: [claude/mfe-fill-instant-precision]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Diagnose front-month resolution scope
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: node scripts/diag-front-month-scope.js
