# Refresh CME holiday calendar
#
# Regenerates lib/cmeHolidays.json from pandas_market_calendars once a year
# and merges the update with no human step - see NOTES.md's "CME holiday
# calendar" section for the full picture. Safe to run unattended because:
#   - the underlying schedule is published by CME a year in advance and
#     essentially never changes after the fact
#   - this workflow builds the app against the regenerated data itself
#     (the same command .github/workflows/ci.yml's Build check runs) and
#     only proceeds to merge if that build succeeds
#   - every run still lands as a normal merged pull request, not a bare
#     push to main, so there's a clean commit + PR history to look back at
#
# One-time setup required: a live test (2026-08-18, run #2) confirmed the
# default GITHUB_TOKEN can't actually open the PR this workflow needs -
# `gh pr create` failed with "GitHub Actions is not permitted to create or
# approve pull requests (createPullRequest)". That's a separate repo-wide
# setting from this file's own `permissions:` block, off by default:
#   Settings -> Actions -> General -> Workflow permissions -> check
#   "Allow GitHub Actions to create and approve pull requests" -> Save
# Flip that on and this workflow works as-is. If you'd rather not grant
# every workflow in the repo that ability, add a repo secret named
# CME_HOLIDAY_REFRESH_TOKEN (a PAT with repo write access) instead - the
# steps below already pick it up automatically, and using a real PAT
# sidesteps this restriction (it only applies to the built-in token).
#
# Separately, and regardless of which fix above you use: pushes/PRs made
# with the default GITHUB_TOKEN don't retrigger other workflows (GitHub's
# own recursion guard), so ci.yml's Build check won't show up as a status
# on these PRs. That's fine on its own (this workflow validates the build
# itself before ever pushing), but if main's branch protection ever
# requires that specific check to merge, only the PAT-secret route above
# fixes it - flipping the Actions setting alone would not.

name: Refresh CME holiday calendar

on:
  schedule:
    # 06:00 UTC, Jan 2nd - a day after CME's own new-year calendar
    # publication, well ahead of the script's END_YEAR (this year + 1)
    # ever running short.
    - cron: '0 6 2 1 *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CME_HOLIDAY_REFRESH_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pandas_market_calendars
        run: pip install pandas pandas_market_calendars

      - name: Regenerate lib/cmeHolidays.json
        run: python3 scripts/generate_cme_holidays.py

      # git status --porcelain, not git diff --quiet - the latter is blind
      # to a brand new untracked file, which matters the very first time
      # this workflow runs against a checkout that doesn't have
      # lib/cmeHolidays.json yet.
      - name: Check whether the calendar actually changed
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- lib/cmeHolidays.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.diff.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.diff.outputs.changed == 'true'
        run: npm install

      # Same build ci.yml's Build check runs, with the same placeholder
      # env vars - this is the gate that makes merging without a human
      # here safe: a script bug or a library change that broke something
      # fails right here and nothing gets pushed.
      - name: Build with the regenerated calendar
        if: steps.diff.outputs.changed == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build

      - name: Open and merge the update
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CME_HOLIDAY_REFRESH_TOKEN || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # run_id, not just the date - a day-only name collides (non-fast-
          # forward push rejection) with a leftover branch from any earlier
          # run that day, including a previous failed attempt whose branch
          # never got merged/deleted. Confirmed live (2026-08-18, run #5).
          BRANCH="cme-holidays-$(date +%Y%m%d)-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add lib/cmeHolidays.json
          git commit -m "Refresh CME holiday calendar"
          git push -u origin "$BRANCH"
          gh pr create --title "Refresh CME holiday calendar" \
            --body "Automated run of scripts/generate_cme_holidays.py on schedule. \`npm run build\` passed against the regenerated data in this same workflow run before the PR was opened." \
            --base main --head "$BRANCH"
          gh pr merge "$BRANCH" --squash --delete-branch
