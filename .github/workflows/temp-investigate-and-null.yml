name: TEMP - investigate continuous symbol + conditional null

on:
  workflow_dispatch: {}
  push:
    branches: [claude/mfe-mae-stop-target-cap]

permissions:
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Investigate + conditional null
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: node scripts/temp-investigate-and-null.js 2>&1 | tee /tmp/output.txt

      - name: Post output as PR comment
        if: always()
        run: |
          {
            echo "### TEMP investigate-and-null output"
            echo '```'
            cat /tmp/output.txt
            echo '```'
          } > /tmp/comment-body.txt
          curl -sS -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/125/comments" \
            -d @<(jq -Rs '{body: .}' /tmp/comment-body.txt)
