# TEMPORARY, one-off workflow - writes exactly the "after" values already
# shown in PR #122's roll-aware diagnostic to the 10 non-excluded trades.
# Deleted after this one run.

name: TEMP - apply diagnostic recompute

on:
  workflow_dispatch: {}

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Apply diagnostic recompute
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: node scripts/apply-diagnostic-recompute.js
