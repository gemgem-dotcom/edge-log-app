name: temp-1s-check-v2

on:
  workflow_dispatch: {}
  push:
    branches: [claude/mfe-mae-stop-target-cap]

permissions:
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Run diagnostic and capture output
        id: diag
        run: node scripts/diag-check-1s-bars.js > diag_output.txt 2>&1 || echo "DIAG_FAILED=1" >> "$GITHUB_ENV"
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
      - name: Show output in job log too
        run: cat diag_output.txt
      - name: Post result as a PR comment (log download host is blocked from this session)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(node -e "
            const fs = require('fs');
            const text = fs.readFileSync('diag_output.txt', 'utf8').slice(0, 60000);
            console.log(JSON.stringify('### 1s/tick data check\n\n\`\`\`\n' + text + '\n\`\`\`'));
          ")
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/125/comments" \
            -d "{\"body\": $BODY}"
