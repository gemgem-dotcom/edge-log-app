name: TEMP - force retry job + dry-run 7e8616fb

on:
  workflow_dispatch: {}
  push:
    branches: [claude/mfe-mae-stop-target-cap]

permissions:
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Force the pending-trade retry job now
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: node scripts/retry-trade-excursions.js 2>&1 | tee /tmp/retry-output.txt

      - name: Dry-run 7e8616fb through the standard pipeline (no writes)
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: node scripts/temp-dryrun-7e8616fb.js 2>&1 | tee /tmp/dryrun-output.txt

      - name: Post output as PR comment
        if: always()
        run: |
          {
            echo "### TEMP retry job (076af9b3 etc) + dry-run 7e8616fb"
            echo "**Retry job output:**"
            echo '```'
            cat /tmp/retry-output.txt
            echo '```'
            echo "**Dry-run 7e8616fb output (no writes):**"
            echo '```'
            cat /tmp/dryrun-output.txt
            echo '```'
          } > /tmp/comment-body.txt
          curl -sS -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/125/comments" \
            -d @<(jq -Rs '{body: .}' /tmp/comment-body.txt)
