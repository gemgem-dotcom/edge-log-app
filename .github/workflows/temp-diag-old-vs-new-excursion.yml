# TEMPORARY, one-off workflow - not part of the app's permanent CI surface.
# Runs scripts/diag-old-vs-new-excursion.js once: a read-only comparison of
# OLD vs NEW MFE/MAE/drawdown logic against real target-hit trades, before
# authorizing the full recompute in PR #122. Deleted after this one run.

name: TEMP - diagnose old vs new excursion logic

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Diagnose old vs new excursion logic
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: node scripts/diag-old-vs-new-excursion.js
