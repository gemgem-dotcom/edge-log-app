# Build check
#
# Runs a full production build of the app on every push and every pull
# request. If the build fails, GitHub puts a red X on the commit, so a
# broken change gets caught before it can reach the live site.
#
# The Supabase values below are throwaway placeholders. The build only
# needs them to exist so the Supabase client can be constructed; nothing
# during a build talks to the real database.

name: Build check

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

  # scripts/retry-trade-excursions.js dynamically imports lib/edgeEngine.js
  # and lib/edgeBeliefs.js directly (plain Node, outside Next.js's
  # bundler) - see the CONSTRAINT comment atop lib/edgeEngine.js. That only
  # works if those two files (and everything they import) stay
  # framework-free, which nothing else here would catch - the `build` job
  # above goes through Next.js's own module resolution, which tolerates
  # things plain Node does not. Pinned to Node 22, not 20, to match
  # .github/workflows/retry-trade-excursions.yml's actual runtime exactly
  # (see that workflow's own comment on why it's 22) - a check on Node 20
  # could pass or fail differently than what the real hourly job would see.
  retry-script-compat:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      # Imports lib/edgeBeliefs.js (which imports lib/edgeEngine.js) from
      # plain Node exactly the way scripts/retry-trade-excursions.js does,
      # so an import failure here fails this PR check the same way it
      # would fail the hourly job - and also runs both copies of the
      # excursion Welford math (the real one and the retry script's
      # duplicate) against the same inputs, failing if they disagree. See
      # scripts/check-excursion-math-parity.js's own header comment.
      - name: Check retry script can still reach the belief-tracking code
        run: node scripts/check-excursion-math-parity.js
