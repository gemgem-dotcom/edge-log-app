# TEMPORARY, one-off workflow - not part of the app's permanent CI surface.
# Runs scripts/diag-roll-aware-recompute.js once: full before/after for
# every currently-complete NQ trade under the new roll-aware fill-instant
# logic, before authorizing any bulk recompute. Deleted after this run.

name: TEMP - diagnose roll-aware recompute

on:
  workflow_dispatch: {}
  push:
    branches: [claude/mfe-fill-instant-precision]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Diagnose roll-aware recompute
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: node scripts/diag-roll-aware-recompute.js
