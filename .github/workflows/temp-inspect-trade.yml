# TEMPORARY, one-off, read-only workflow - inspects trade 7e8616fb's raw
# fields for a plausibility check (PR #122). Deleted after this one run.

name: TEMP - inspect trade

on:
  workflow_dispatch: {}
  push:
    branches: [claude/mfe-fill-instant-precision]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Inspect trade
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: node scripts/diag-inspect-trade.js
