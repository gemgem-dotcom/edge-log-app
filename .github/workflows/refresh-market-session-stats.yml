# Daily market-session-stats fetch
#
# Runs scripts/fetch-daily-market-stats.js once a day, fetching the
# *previous* completed session's ohlcv-1m bars from Databento's Historical
# API for every instrument in lib/instrumentCatalog.js (all 12, each on its
# own exact contract rather than collapsed onto its data_symbol family) and
# storing total_range/total_volume per contract in market_session_stats. See
# schema.sql's comment above `create table market_session_stats` and
# NOTES.md for the full picture.
#
# Scheduled the morning after, at a fixed UTC hour, not the same evening -
# confirmed live (two runs, hours apart) that this Databento account's
# access to GLBX.MDP3 lags wall-clock time by ~8 hours, gated behind an
# explicit "requires a subscription and/or license" error. The original
# 23:30 UTC same-evening schedule asked for a session that had technically
# closed but that an 8-hours-behind account could never yet see: CME's own
# close (~21:00-22:00 UTC) is itself less than 8 hours before 23:30 UTC.
# Nothing downstream of this table needs same-evening data - every reader
# (lib/tradeRegimes.js, lib/todaysBrief.js) already works off "the most
# recently completed session," whatever that happens to be - so running
# the morning after and fetching yesterday's date is a strictly safer fit,
# not a compromise. Fixed UTC rather than a DST-aware "5am ET" translation
# deliberately - the embargo is wall-clock-based, not ET-based, and this
# avoids the added complexity of converting a variable local time for no
# benefit here.
#
# Unlike refresh-cme-holidays.yml, this workflow never touches a committed
# file - it writes straight to Supabase (via SUPABASE_SERVICE_ROLE_KEY, the
# same key the two API routes in app/api/ use) and exits, so there's no
# git commit/PR/build-gate mechanic here. The script itself is the safety
# net: it fails gracefully (skips the day, logs why, exits 0) rather than
# crashing on a holiday, a weekend, an unreachable Databento API, or an
# unresolved symbol - see the script's own comments.
#
# One-time setup required - repo secrets this workflow needs that don't
# otherwise exist for GitHub Actions (Vercel has them, Actions does not):
# Settings -> Secrets and variables -> Actions -> New repository secret:
#   DATABENTO_API_KEY           same value as .env.local's
#   SUPABASE_SERVICE_ROLE_KEY   same value as .env.local's
#   NEXT_PUBLIC_SUPABASE_URL    same value as .env.local's (not a secret by
#                                nature, but stored as one here since this
#                                workflow has no other config mechanism)
#   NEXT_PUBLIC_SENTRY_DSN       optional - same value as Vercel's, if
#                                Sentry error tracking is set up (see
#                                sentry.server.config.js). scripts/fetch-
#                                daily-market-stats.js's own Sentry.init
#                                no-ops if this isn't set, so leaving it out
#                                is safe, just silent on a graceful-skip day.

name: Refresh market session stats

on:
  schedule:
    # 09:30 UTC, fixed year-round - comfortably past the ~8-hour embargo
    # from even the latest possible close (22:00 UTC, EDT), confirmed live
    # against this account. See the header comment above for why this is a
    # fixed UTC hour rather than a DST-aware local-time translation.
    - cron: '30 9 * * *'
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # 22, not 20 (the app's own package.json target) - @supabase/
          # supabase-js's createClient always constructs an internal
          # Realtime (WebSocket) sub-client, even though this script never
          # uses realtime subscriptions, and that constructor throws under
          # Node 20 for lacking native WebSocket support (added in Node 21,
          # stable in 22) rather than silently skipping it. Confirmed live -
          # this exact error killed a real run before this was pinned to 22.
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Fetch and store yesterday's session stats
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
        run: node scripts/fetch-daily-market-stats.js
